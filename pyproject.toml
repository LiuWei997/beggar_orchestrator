[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "beggar-orchestrator"
version = "0.3.0"
description = "A small, provider-neutral Python router for LLM APIs and local CLIs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
auth = ["keyring>=25,<26"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
beggar-auth = "beggar_orchestrator.config:main"

[tool.hatch.build.targets.wheel]
packages = ["src/beggar_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
